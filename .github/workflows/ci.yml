name: CI

# The gate on every pull request. `bin/check` is the same thing locally; these
# jobs exist so a green claim is a measurement rather than a report.
#
# Unlike a forked product repo, this one resolves its siblings from pub.dev, so CI
# needs no sibling checkouts. The gitignored pubspec_overrides.yaml that points
# them at local trees during development is absent here on purpose: CI resolving
# the PUBLISHED versions is what catches a dependency on unreleased sibling code.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only for pull requests: cancelling a main run would leave that commit with no
  # green record at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instructions:
    name: Instruction mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md is a symlink to AGENTS.md
        run: |
          if [ ! -L CLAUDE.md ] || [ "$(readlink CLAUDE.md)" != "AGENTS.md" ]; then
            echo "CLAUDE.md must be a symlink to AGENTS.md so both tools read one file." >&2
            exit 1
          fi
      - name: .github mirrors are current
        run: bin/sync-instructions --check

      # The siblings are not in this checkout, so the script falls back to verifying each copy
      # against the sha256 it recorded. That catches a hand-edit here and says plainly that
      # upstream freshness was not checked; only a local run with the working trees can do that.
      - name: Package skill copies are unedited
        run: bin/sync-skills --check

      # Pure Python over lib/, so it needs no Flutter toolchain and belongs here rather than in
      # the Flutter job. `bin/check` runs the same assertion locally.
      - name: Component registry is current
        run: bin/sync-registry --check

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # bin/check's run_lockfile never runs in CI, because CI does not invoke
      # bin/check at all: it runs the individual tools. Without this step the
      # only thing standing between a path-poisoned lock and main is whether a
      # developer chose to run the gate locally, and the symptom in CI would be
      # a pub resolution error naming a directory nobody recognises. Before
      # `flutter pub get`, since that would rewrite the evidence.
      - name: Committed lock is hosted-only
        run: |
          if grep -qE 'source: (path|git)' pubspec.lock; then
            echo "pubspec.lock carries local sibling paths. Regenerate it with pubspec_overrides.yaml moved aside." >&2
            grep -nE 'source: (path|git)' pubspec.lock >&2
            exit 1
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # PHP 8.4 rather than the ^8.3 composer.json declares, because the committed
  # lock resolves symfony 8.1, which requires php >=8.4.1: `composer install` on
  # 8.3 dies in a wall of "Problem N" lines that read like a corrupt lock and are
  # really a platform mismatch. 8.4 is the floor the lock actually demands, and a
  # boilerplate is worth testing at its floor rather than at the newest release.
  backend:
    name: Backend (pint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, bcmath, intl, zip, gd
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # A Blade view that calls @vite throws without a manifest, and public/build is
      # gitignored, so a page test would fail on Vite rather than on its subject.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build assets
        run: npm ci && npm run build
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  # Checkout is the whole setup: `bin/design-tokens` is bash, awk and grep over
  # `lib/**/*.dart`, so it needs neither Flutter nor a dependency install and runs
  # in well under a second. A new job rather than a step inside the Flutter one, so
  # a raw colour literal reports as its own line instead of hiding behind an
  # analyze failure.
  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for raw color literals
        run: bin/design-tokens

  # No sibling checkouts and no pubspec_overrides.yaml (gitignored, never checked
  # out here): this is the exact graph `flutter pub add` gives a fork. Before Step
  # 1, pubspec.yaml pinned `magic_notifications: ^0.0.2`, which does not intersect
  # `magic_starter` alpha.26's own `^0.2.0` requirement, so pub silently walked the
  # starter back to alpha.24 and `flutter pub get` still exited 0. A resolve-only
  # job would have stayed green through that regression; the version assertion
  # below is what actually observes it.
  published:
    name: Published graph (hosted resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve against pub.dev
        run: flutter pub get
      # The lock is TRACKED, so a resolve that rewrites it means the committed
      # lock disagreed with pubspec.yaml. CI would otherwise repair that in
      # place and inspect the repaired copy, so the drift never surfaces and a
      # fork keeps cloning a lock nothing has verified. bin/check's run_lockfile
      # cannot see this: it reads the index on a developer's machine, and there
      # is no index here.
      - name: Assert the committed lock matches what pub.dev resolves
        run: git diff --exit-code -- pubspec.lock
      - name: Analyze against the published siblings
        run: flutter analyze
      # `flutter pub get` exits 0 on a downgrade as long as SOME version in the
      # constraint range resolves; it does not care which one. Reading the lock's
      # own hosted version is the only way to tell the intended release apart
      # from a silent walk-back to an older prerelease, which is what this repo
      # shipped for several releases: a `magic_notifications` constraint stopped
      # intersecting the starter's own requirement and pub quietly chose
      # alpha.24 instead of failing.
      #
      # The floor is READ from pubspec.yaml rather than written here. A literal
      # would turn this job red on the next routine bump, in a file whose author
      # has no reason to look, and the failure would name a version nobody typed.
      - name: Assert magic_starter did not resolve below its constraint floor
        run: |
          floor=$(grep -E '^[[:space:]]+magic_starter:' pubspec.yaml | sed -E 's/.*\^//')
          resolved=$(awk '/^  magic_starter:/{f=1; next} f && /^    version:/{print $2; exit} f && /^  [a-zA-Z]/{exit}' pubspec.lock | tr -d '"')
          echo "constraint floor: ${floor:-<not found>} | resolved: ${resolved:-<not found>}"
          if [ -z "$floor" ] || [ -z "$resolved" ]; then
            echo "could not read the floor from pubspec.yaml or the version from pubspec.lock; the assertion below would pass vacuously" >&2
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$floor" "$resolved" | sort -V | head -1)" != "$floor" ]; then
            echo "magic_starter resolved to '$resolved', which is BELOW the '$floor' floor in pubspec.yaml. Some constraint stopped intersecting what that release requires, and pub picked an older one rather than failing." >&2
            exit 1
          fi
